name: Frontend checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Reject frontend/Soroban ABI drift from pinned reviewed contracts
        run: node scripts/verify-soroban-interface.mjs
      - name: Reject frontend/SDK generated wire-model drift
        run: node scripts/verify-sdk-wire.mjs
      - name: Verify read-only observer health uses exact pinned SDK implementation
        run: node scripts/verify-observation-health.mjs
      - name: Validate product catalog and preview isolation
        run: node --experimental-strip-types --test tests/platform-modules.test.mjs
      - name: Enforce pinned SDK developer preflight parity
        run: node scripts/verify-developer-readiness.mjs
      - name: Regression-test developer integration and preview isolation
        run: node --experimental-strip-types --test tests/developer-readiness.test.mjs tests/business-review.test.mjs tests/business-envelope.test.mjs tests/business-live-input.test.mjs
      - run: npm run typecheck
      - run: npm run build
        env:
          STEALTHBRIDGE_SITE_MODE: landing
      - run: npm run test:landing
      - name: Regression-test production marketing route policy and forbidden writes
        run: node --test tests/marketing-policy-smoke.test.mjs
      - name: Verify staging smoke checks against isolated HTTP fixtures
        run: node --test tests/smoke.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Upload marketing motion evidence (public pages only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketing-motion-evidence
          path: |
            test-results/**/motion-evidence/*.png
            test-results/**/*.webm
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload responsive marketing primitive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-marketing-evidence
          path: test-results/**/marketing-primitives/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Build isolated Testnet preview for safety browser tests
        run: npm run build
        env:
          STEALTHBRIDGE_SITE_MODE: preview
      - name: Assert transfer controls stay disabled in preview
        run: npm run test:browser
        env:
          STEALTHBRIDGE_TEST_PREVIEW: "1"
      - name: Require desktop/mobile technical-preview network-state evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: technical-preview-state-evidence
          path: test-results/**/preview-network-evidence/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

name: Frontend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Reject frontend/Soroban ABI drift from pinned reviewed contracts
        run: node scripts/verify-soroban-interface.mjs
      - run: npm run typecheck
      - run: npm run build
        env:
          STEALTHBRIDGE_SITE_MODE: landing
      - run: npm run test:landing
      - name: Verify staging smoke checks against isolated HTTP fixtures
        run: node --test tests/smoke.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Build isolated Testnet preview for safety browser tests
        run: npm run build
        env:
          STEALTHBRIDGE_SITE_MODE: preview
      - name: Assert transfer controls stay disabled in preview
        run: npm run test:browser
        env:
          STEALTHBRIDGE_TEST_PREVIEW: "1"
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
